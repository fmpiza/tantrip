<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanzania Northern Safari Route Map</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --accent: #d4a373;
            --bg-dark: #1b4332;
            --light: #f8f9fa;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        .map-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        svg {
            width: 100%;
            height: auto;
            background: #fdfbf7;
            border: 1px solid #e0dcd3;
            border-radius: 8px;
        }

        /* Route Path Styling */
        .route-line {
            stroke: var(--accent);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 8, 8;
            animation: routeFlow 30s linear infinite;
        }

        @keyframes routeFlow {
            to { stroke-dashoffset: -20; }
        }

        /* Interactive Location Markers */
        .marker {
            fill: var(--primary);
            stroke: #fff;
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .marker:hover, .marker.active {
            fill: var(--accent);
            r: 10;
        }

        .marker-start {
            fill: #ae2012;
        }

        /* Tooltip & Info Cards */
        .info-panel {
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-dark);
            color: var(--light);
            border-radius: 8px;
            min-height: 80px;
            transition: all 0.3s ease;
        }

        .info-panel h3 {
            margin-top: 0;
            color: var(--accent);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

<div class="map-container">
    <h2>Tanzania Northern Tourism Circuit Route</h2>
    
    <div class="legend">
        <div class="legend-item"><span style="color:#ae2012; font-size:1.5rem; line-height:0;">●</span> Gateway / Start</div>
        <div class="legend-item"><span style="color:#2d6a4f; font-size:1.5rem; line-height:0;">●</span> National Park / Attraction</div>
        <div class="legend-item"><span style="color:#d4a373; font-weight:bold;">- - -</span> Safari Route Path</div>
    </div>

    <!-- Interactive Route SVG Map -->
    <svg viewBox="0 0 800 500" xmlns="http://w3.org">
        <!-- Background elements / Country Context boundaries simulation -->
        <rect width="100%" height="100%" fill="#faf6f0"/>
        
        <!-- Route Connecting Lines -->
        <!-- Coordinates map out a sequential travel flow across Northern TZ -->
        <path d="M 680,380 L 520,400 L 460,310 L 350,220 L 160,160" fill="none" class="route-line" />

        <!-- Location Markers -->
        <!-- Stop 1: Arusha -->
        <circle cx="680" cy="380" r="8" class="marker marker-start" data-name="Arusha (Starting Point)" data-desc="The undisputed safari capital of Tanzania. Nestled under Mount Meru, this is where your Northern Circuit journey begins, maps are customized, and brief orientations take place." />
        <text x="680" y="405" text-anchor="middle" font-weight="bold" font-size="12" fill="#333">Arusha</text>

        <!-- Stop 2: Tarangire National Park -->
        <circle cx="520" cy="400" r="7" class="marker" data-name="Tarangire National Park" data-desc="Famous for its iconic giant Baobab trees and massive elephant herds migration. The Tarangire River serves as the primary freshwater source for wildlife in the entire ecosystem." />
        <text x="520" y="425" text-anchor="middle" font-size="12" fill="#333">Tarangire</text>

        <!-- Stop 3: Lake Manyara National Park -->
        <circle cx="460" cy="310" r="7" class="marker" data-name="Lake Manyara National Park" data-desc="An emerald jewel famous for its legendary tree-climbing lions, rich flamingo populations blanketing the soda lake, and diverse underground water forests." />
        <text x="495" y="305" text-anchor="middle" font-size="12" fill="#333">Lake Manyara</text>

        <!-- Stop 4: Ngorongoro Conservation Area -->
        <circle cx="350" cy="220" r="7" class="marker" data-name="Ngorongoro Crater" data-desc="A breathtaking UNESCO World Heritage site. This intact volcanic caldera forms a pristine natural amphitheater harboring over 25,000 large animals, including the rare Black Rhino." />
        <text x="350" y="200" text-anchor="middle" font-size="12" fill="#333">Ngorongoro</text>

        <!-- Stop 5: Serengeti National Park -->
        <circle cx="160" cy="160" r="7" class="marker" data-name="Serengeti National Park" data-desc="The ultimate safari destination. World-renowned for endless golden savannah plains and the seasonal Great Wildebeest Migration tracking across its vast ecosystem." />
        <text x="160" y="140" text-anchor="middle" font-weight="bold" font-size="12" fill="#333">Serengeti</text>
    </svg>

    <!-- Context Window displaying Route information dynamically -->
    <div class="info-panel" id="info-panel">
        <h3>Interactive Safari Route Map</h3>
        <p>Click or hover over any location marker on the map to visualize route segments, view destination specifications, and explore travel details.</p>
    </div>
</div>

<script>
    const markers = document.querySelectorAll('.marker');
    const infoPanel = document.getElementById('info-panel');

    function updateInfo(marker) {
        // Clear previous active states
        markers.forEach(m => m.classList.remove('active'));
        
        // Activate current selection
        marker.classList.add('active');
        
        // Inject data features dynamically
        const name = marker.getAttribute('data-name');
        const desc = marker.getAttribute('data-desc');
        
        infoPanel.innerHTML = `<h3>${name}</h3><p>${desc}</p>`;
    }

    markers.forEach(marker => {
        // Event triggers for desktop and mobile utility
        marker.addEventListener('mouseenter', () => updateInfo(marker));
        marker.addEventListener('click', () => updateInfo(marker));
    });
</script>

</body>
</html>
