<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
      z-index: 2;
    }

    /* Welcome message */
    .welcome {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      text-align: center;
      color: white;
      z-index: 2;
    }

    .welcome h1 {
      font-size: clamp(30px, 6vw, 65px);
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px black;
    }

    .welcome p {
      font-size: clamp(16px, 2.5vw, 25px);
      text-shadow: 2px 2px 6px black;
    }

    /* Optional dark overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .welcome a {
  text-decoration: none;
}
  </style>
</head>
<body>

  <div class="video-container">

    <video autoplay muted loop id="myVideo"  width="100%" height="100%">
      <source src="tantripvideo.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <img src="logotantrip.png" alt="Logo" class="logo">

    <div class="welcome">
      <h1>Welcome to TanTrip Tours and Safari</h1>
      <p>Enjoy Your Trip with TanTrip Tours and Safari!</p>
      <p>
          <button type="button" class="btn btn-success"><a href="home.html"><font color="black" size=4><b><i>Home</i></b></font>
        </button> 
          </p>
      
      </p>
     
    
    </div>

  </div>

</body>
</html>
